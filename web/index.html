<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO Meta Tags -->
  <title>BF Stay - Gestión de Alojamientos</title>
  <meta name="description" content="BF Stay - Tu alojamiento perfecto. Acceso a reservas, check-in digital, guías locales, normas de la casa y contacto directo con el anfitrión.">
  <meta name="keywords" content="alojamiento, reservas, check-in, huéspedes, turismo, apartamentos, BF Stay">
  <meta name="author" content="BF Stay">

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0D0D0D">
  <meta name="msapplication-navbutton-color" content="#0D0D0D">

  <!-- iOS Meta Tags & Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BF Stay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="BF Stay - Gestión de Alojamientos">
  <meta property="og:description" content="Tu alojamiento perfecto. Check-in digital, guías locales y contacto directo con el anfitrión.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect para optimización -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0D0D0D;
    }

    /* Loading indicator mientras carga Flutter */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background-color: #0D0D0D;
      z-index: 9999;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #1A1A1A;
      border-top-color: #FFC916;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      color: #FFC916;
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ocultar loading cuando Flutter está listo */
    #loading.hidden {
      opacity: 0;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }

    /* Contenedor de Flutter */
    flutter-view {
      background-color: #0D0D0D;
    }
  </style>
</head>
<body>
  <!-- Loading indicator mientras carga Flutter -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <span class="loading-text">Cargando BF Stay...</span>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Ocultar loading cuando Flutter termina de inicializar
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        // Eliminar completamente después de la transición
        setTimeout(() => {
          loading.remove();
        }, 300);
      }
    });

    // Fallback: ocultar loading después de 10 segundos si algo falla
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 300);
      }
    }, 10000);
  </script>
</body>
</html>
