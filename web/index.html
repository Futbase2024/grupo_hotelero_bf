<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO Meta Tags -->
  <title>BF Stay - Gestión de Alojamientos</title>
  <meta name="description" content="BF Stay - Tu alojamiento perfecto. Acceso a reservas, check-in digital, guías locales, normas de la casa y contacto directo con el anfitrión.">
  <meta name="keywords" content="alojamiento, reservas, check-in, huéspedes, turismo, apartamentos, BF Stay">
  <meta name="author" content="BF Stay">

  <!-- Theme Colors -->
  <meta name="theme-color" content="#FFC916">
  <meta name="msapplication-navbutton-color" content="#FFC916">

  <!-- iOS Meta Tags & Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BF Stay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="BF Stay - Gestión de Alojamientos">
  <meta property="og:description" content="Tu alojamiento perfecto. Check-in digital, guías locales y contacto directo con el anfitrión.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect para optimización -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- Loading indicator mientras carga Flutter -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0D0D;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #1A1A1A;
      border-top-color: #FFC916;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      color: #FFC916;
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <span class="loading-text">Cargando BF Stay...</span>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
