<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9d406", // Gold
                        "silver": "#c0c0c0",
                        "background-light": "#f8f8f5",
                        "background-dark": "#0a0a0a", // Deep Black
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

</div>

<div class="absolute -bottom-1 -right-1 bg-primary text-background-dark rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] font-bold">star</span>
</div>
</div>
<div>
<p class="text-xs font-medium text-silver/80 uppercase tracking-widest">Bienvenido</p>
<h1 class="text-xl font-extrabold text-slate-100">Julián Domínguez</h1>
<p class="text-sm text-primary font-semibold">Miembro Gold • Suite 402</p>

<button class="bg-primary/10 p-3 rounded-full text-primary border border-primary/20">

</button>

<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">

<span class="text-slate-100 font-bold text-sm">Check-in Digital</span>
<span class="text-silver/60 text-[10px] mt-1">Acceso rápido</span>

<!-- Llave Digital -->
<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">

</button>

<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">hot_tub</span>

<span class="text-silver/60 text-[10px] mt-1">Relax y confort</span>

<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">
<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">wifi</span>
<span class="text-slate-100 font-bold text-sm">Clave WiFi</span>
<span class="text-silver/60 text-[10px] mt-1">Conexión 5G</span>
</button>

<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">
<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">directions_car</span>
<span class="text-slate-100 font-bold text-sm">Aparcamientos</span>
<span class="text-silver/60 text-[10px] mt-1">Plaza exclusiva</span>
</button>
<!-- Chat de Soporte -->

<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">chat</span>
<span class="text-slate-100 font-bold text-sm">Chat Soporte</span>
<span class="text-silver/60 text-[10px] mt-1">Conserje 24/7</span>
</button>

<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">
<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">credit_card</span>
<span class="text-slate-100 font-bold text-sm">Pagos &amp; Facturas</span>
<span class="text-silver/60 text-[10px] mt-1">Gestión de gastos</span>
</button>
<!-- Promociones -->
<button class="flex flex-col items-start p-5 rounded-xl bg-slate-800/20 border border-slate-800 backdrop-blur-sm hover:bg-slate-800/40 transition-all group">
<span class="material-symbols-outlined text-primary text-3xl mb-3 transition-transform group-hover:scale-110">sell</span>
<span class="text-slate-100 font-bold text-sm">Promociones</span>
<span class="text-silver/60 text-[10px] mt-1">Ofertas VIP</span>
</button>

</a>
<a class="flex flex-col items-center gap-1 text-silver/40" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="text-[10px] font-bold">Explorar</span>
</a>
<a class="flex flex-col items-center gap-1 text-silver/40" href="#">
<span class="material-symbols-outlined">confirmation_number</span>
<span class="text-[10px] font-bold">Reservas</span>
</a>
<a class="flex flex-col items-center gap-1 text-silver/40" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold">Perfil</span>
</a>

<div class="w-32 h-1 bg-slate-700 rounded-full"></div>
</div>
