name: bf_stay
description: BF Stay - Guest & Staff Management App
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.0

  # Backend
  supabase_flutter: ^2.8.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Dependency Injection
  get_it: ^8.0.3

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0
  shared_preferences: ^2.2.2
  share_plus: ^10.1.4

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.14.2
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.8

  url_launcher: ^6.3.1
  camera: ^0.12.0
  image: ^4.5.3

  # App Updates
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

# Configuración del splash screen nativo - Imagen de fondo completa
flutter_native_splash:
  background_image: assets/splash/splash1.png
  background_image_dark: assets/splash/splash1.png
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true

# Configuración del icono de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logoBF.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logoBF.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/splash/
    - assets/alojamientos/
    - assets/alojamientos/habitaciones/
    - assets/alojamientos/zonas_comunes/
    - assets/fonts/

  # Usamos google_fonts en lugar de fuentes locales
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
