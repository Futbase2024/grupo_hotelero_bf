<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5C962"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8942D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="100" r="150" fill="#D4AF37" opacity="0.05"/>
  <circle cx="100" cy="400" r="120" fill="#D4AF37" opacity="0.08"/>

  <!-- Logo BF -->
  <g transform="translate(80, 120)">
    <!-- B -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="150" font-weight="bold" fill="url(#goldGradient)">B</text>
    <!-- F -->
    <text x="110" y="140" font-family="Arial, sans-serif" font-size="150" font-weight="bold" fill="url(#goldGradient)">F</text>
    <!-- STAY -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="60" font-weight="300" fill="#C0C0C0" letter-spacing="15">STAY</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" opacity="0.9">
    Tu alojamiento perfecto, a un clic de distancia
  </text>

  <!-- Features icons and text -->
  <g transform="translate(550, 150)">
    <!-- Check-in icon -->
    <circle cx="60" cy="60" r="40" fill="#D4AF37" opacity="0.15"/>
    <text x="60" y="70" font-family="Arial, sans-serif" font-size="36" fill="#D4AF37" text-anchor="middle">✓</text>
    <text x="60" y="130" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Check-in</text>
    <text x="60" y="150" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Digital</text>

    <!-- Normas icon -->
    <circle cx="200" cy="60" r="40" fill="#D4AF37" opacity="0.15"/>
    <text x="200" y="70" font-family="Arial, sans-serif" font-size="36" fill="#D4AF37" text-anchor="middle">📋</text>
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Normas</text>
    <text x="200" y="150" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Casa</text>

    <!-- Chat icon -->
    <circle cx="340" cy="60" r="40" fill="#D4AF37" opacity="0.15"/>
    <text x="340" y="70" font-family="Arial, sans-serif" font-size="36" fill="#D4AF37" text-anchor="middle">💬</text>
    <text x="340" y="130" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Chat</text>
    <text x="340" y="150" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Directo</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="485" width="1024" height="15" fill="url(#goldGradient)"/>
</svg>
