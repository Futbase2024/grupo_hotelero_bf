name: Cleanup Expired Documents

on:
  # Ejecutar cada día a las 3:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Permitir ejecutar manualmente desde GitHub
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Supabase Edge Function
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/cleanup-documents" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CLEANUP_SECRET }}" \
            -w "\n%{http_code}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Cleanup completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Document cleanup failed. Check the logs for details."

# Secrets necesarios en GitHub:
# - SUPABASE_URL: https://qwepisgdqlmqfxwqkztz.supabase.co
# - CLEANUP_SECRET: El secreto configurado en Supabase (opcional)
